name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the Android SDK (pinned to build-tools 34)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "$SDK/platforms" "$SDK/build-tools" || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi
          mkdir -p "$HOME/sdk/platforms" "$HOME/sdk/build-tools"
          ln -sfn "$SDK/platforms/android-34" "$HOME/sdk/platforms/android-34"
          ln -sfn "$SDK/build-tools/34.0.0" "$HOME/sdk/build-tools/34.0.0"
          echo "ANDROID_HOME=$HOME/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/sdk" >> "$GITHUB_ENV"
          ls "$HOME/sdk/platforms/android-34/android.jar" "$HOME/sdk/build-tools/34.0.0/d8"
      - name: Find the project (unpack the zip if that is all the repo has)
        id: src
        run: |
          if [ ! -f build.gradle ]; then
            for z in ./*.zip; do unzip -q -o "$z"; done
          fi
          dir=$(dirname "$(find . -maxdepth 2 -name build.gradle -print -quit)")
          test -f "$dir/build.gradle" || { echo "build.gradle not found - did you upload the zip?"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Build (desktop + Android jar)
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew clean deploy --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Scheme-Size
          path: ${{ steps.src.outputs.dir }}/build/libs/Scheme-Size.jar
      - name: Publish the jar as a release (direct download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.src.outputs.dir }}/build/libs/Scheme-Size.jar" --title "Scheme Size lite" --notes "Latest build"
